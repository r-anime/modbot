name: Code Verification

on: [push, pull_request]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Python version
        id: python-version
        run: |
          version=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+(\.[0-9]+)?)-[^[:space:]]+[[:space:]]+AS build-image$/\1/p' Dockerfile | head -n 1)
          test -n "$version" || { echo "Could not find Python version for build-image" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python-version.outputs.version }}

      - name: Install Python dependencies
        run: pip install black flake8

      - name: Run linters
        id: linters
        uses: wearerequired/lint-action@v3
        with:
          black: true
          auto_fix: false
          black_args: "--line-length 120"
          flake8: true
          flake8_args: "--max-line-length=120"
          continue_on_error: false
